name: Mac app

# Builds the native Mac app, packs it into Hardwood.dmg (downloadable from the run's Artifacts),
# then runs the unit tests on macOS.
#
# This is the only place the Mac half of the app meets a compiler. The iOS workflow builds for
# the iPhone simulator, where every file behind `#if os(macOS)` compiles to nothing, so a green
# iOS run says nothing about the Mac screens. The build runs scripts/make_dmg.sh -- the same
# script a person runs on their own Mac -- so CI and a local build cannot drift apart.

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "contracts/**"
      - "scripts/make_dmg.sh"
      - "scripts/check_mac_launch.sh"
      - "scripts/ci_mac_server.sh"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

# Hosted macOS runners are scarce: the first run of this workflow was cancelled after fifteen
# minutes with "The job was not acquired by Runner of type hosted", under a GitHub notice about
# capacity constraints on macOS arm64. Only the newest commit on a branch matters for a disk
# image, so a newer push cancels the older run instead of queueing a second job for the same
# scarce machines.
concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the runner, because that is what scripts/make_dmg.sh meets on a Mac
      # set up today. Xcode 16.2 built this app and its disk image once (commit 22b1d66), and the
      # iOS workflow builds and tests the shared code with the newest Xcode; this is what checks
      # the Mac-only half against it.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(python3 - <<'EOF'
          import glob, re
          apps = [a for a in glob.glob("/Applications/Xcode_*.app") if "beta" not in a.lower()]
          key = lambda a: [int(n) for n in re.findall(r"\d+", a.rsplit("/", 1)[-1])]
          print(sorted(apps, key=key)[-1])
          EOF
          )"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build the Mac app and Hardwood.dmg
        run: scripts/make_dmg.sh

      - name: Upload Hardwood.dmg
        uses: actions/upload-artifact@v4
        with:
          name: Hardwood-mac
          path: dist/Hardwood.dmg
          if-no-files-found: error
          retention-days: 30

      # After the upload, so a failing test still leaves a disk image to try -- and the run still
      # goes red, so it is never mistaken for a clean one.
      - name: Unit tests on macOS
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project NBAStats.xcodeproj \
            -scheme Hardwood \
            -destination 'platform=macOS' \
            -derivedDataPath ../build/mac-test \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            2>&1 | tee ../build/mac-test.log | xcpretty || {
              echo "---- failures, once each ----"
              grep -E '(error|fatal error): |: error -|Test Case .* failed' ../build/mac-test.log | sort -u | head -100
              exit 1
            }

  # Opens the app from the uploaded disk image -- the exact bytes a person downloads -- on every
  # sidebar screen in both leagues, and fails with macOS's crash report if it quits. The first disk
  # image passed every unit test above and still quit unexpectedly on a real Mac: the tests host a
  # Debug build and draw almost none of the screens, so they cannot see a Release app falling over.
  #
  # Three scenarios, because a person meets three: the app opened before the server is installed,
  # demo mode (bundled fixtures), and a running server with a league in it and an API key in the
  # installer's settings file, which the app reads on launch. Two macOS versions, because the
  # runners' macOS 15 is not what a Mac bought or updated this year runs.
  launch-check:
    needs: build-dmg
    if: ${{ !cancelled() && needs.build-dmg.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Hardwood-mac
          path: dist

      - name: No server yet
        run: |
          defaults delete com.hardwood.nbastats >/dev/null 2>&1 || true
          scripts/check_mac_launch.sh dist/Hardwood.dmg no-server 6

      - name: Demo mode
        if: ${{ success() || failure() }}
        run: |
          defaults delete com.hardwood.nbastats >/dev/null 2>&1 || true
          defaults write com.hardwood.nbastats hardwood.demoMode -bool true
          scripts/check_mac_launch.sh dist/Hardwood.dmg demo 10

      - uses: actions/setup-python@v5
        if: ${{ success() || failure() }}
        with:
          python-version: "3.12"

      - name: Install the server
        if: ${{ success() || failure() }}
        run: scripts/ci_mac_server.sh install

      # The invented NBA league and the invented EuroLeague (HARDWOOD_EL_DEMO), so every
      # EuroLeague screen has a league to draw, not just an empty store.
      - name: Seeded server
        if: ${{ success() || failure() }}
        env:
          EL_STORE: el-demo
          HARDWOOD_EL_DEMO: "1"
          HARDWOOD_EL_LIVE: "0"
        run: |
          scripts/ci_mac_server.sh start
          scripts/ci_mac_server.sh mark
          defaults delete com.hardwood.nbastats >/dev/null 2>&1 || true
          scripts/check_mac_launch.sh dist/Hardwood.dmg server 12
          scripts/ci_mac_server.sh stop
          scripts/ci_mac_server.sh refusals

      # What a Mac running install.sh actually serves: the EuroLeague's current season fetched live
      # by the worker's own jobs, and real headlines. Invented data is tidy in ways a real season is
      # not. The app runs with a European region (decimal commas, day-first dates), as on the Mac
      # the first disk image crashed on.
      - name: Live EuroLeague data, European region
        # One runner is enough to ask the EuroLeague's service for a season; the newer macOS.
        if: ${{ (success() || failure()) && matrix.runner == 'macos-26' }}
        env:
          EL_STORE: el-live
          HARDWOOD_EL_DEMO: "0"
          HARDWOOD_EL_LIVE: "1"
        run: |
          scripts/ci_mac_server.sh start
          scripts/ci_mac_server.sh ingest-el
          scripts/ci_mac_server.sh stop
          scripts/ci_mac_server.sh start
          scripts/ci_mac_server.sh mark
          defaults delete com.hardwood.nbastats >/dev/null 2>&1 || true
          defaults write com.hardwood.nbastats AppleLocale en_DE
          scripts/check_mac_launch.sh dist/Hardwood.dmg live-en_DE 15
          scripts/ci_mac_server.sh stop
          scripts/ci_mac_server.sh refusals

      - name: Server log
        if: ${{ failure() }}
        run: tail -n 150 "$RUNNER_TEMP/hardwood/api.log" || true
