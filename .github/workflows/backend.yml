name: Backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "contracts/**"
      - "scripts/**"
      - "web/**"
      - "ios/NBAStats/DesignSystem/**"
      - "ios/NBAStats/Core/DashboardLayout.swift"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "scripts/**"
      - "web/**"
      - "ios/NBAStats/DesignSystem/**"
      - "ios/NBAStats/Core/DashboardLayout.swift"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Editable install of the real package + extras, not a hand-copied dependency list:
          # a dependency added to pyproject.toml (e.g. the [web] extra's pyjwt) now actually
          # arrives here instead of silently passing CI while failing on every other machine.
          pip install -e "backend[test,serve,web]"

      - name: Contract drift guard
        run: python scripts/check_contracts.py

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      # The golden fixtures are what the iOS client decodes, so a contract change that does not
      # regenerate them must fail here rather than at runtime on a device.
      - name: Fixtures are reproducible
        working-directory: backend
        run: |
          python -m nbastats.fixtures_export --out ../contracts/fixtures
          git diff --exit-code -- ../contracts/fixtures
