name: iOS

on:
  push:
    branches: ["**"]
    paths: ["ios/**", "contracts/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "contracts/**", ".github/workflows/ios.yml"]

jobs:
  build-and-test:
    # The app cannot be compiled on Linux — this job is the only place the Swift compiler ever
    # sees the code, so treat a failure here as the real build result.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # check_contracts.py supersedes the old three-file `diff -q`: its check (e) makes the
      # same byte-for-byte comparison, and its other checks catch what the diff never could —
      # in particular a Theme.swift edit that never made it into contracts/theme.json (check i).
      # It needs the backend package importable (check d imports nbastats.widgets to compare
      # resolvers against the catalog), so this is the only place ios.yml touches Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend (for the contract checker's imports)
        run: |
          python3 -m pip install --upgrade pip
          pip install -e "backend[test,serve,web]"

      - name: Contract drift guard
        run: python3 scripts/check_contracts.py

      - name: Build
        working-directory: ios
        run: |
          xcodebuild build \
            -project NBAStats.xcodeproj \
            -scheme Hardwood \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -project NBAStats.xcodeproj \
            -scheme Hardwood \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
