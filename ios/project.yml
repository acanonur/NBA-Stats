# XcodeGen spec — an alternative to the checked-in NBAStats.xcodeproj.
#
# The .xcodeproj in this directory is hand-maintained and uses Xcode 16 file-system
# synchronized groups, so new Swift files are picked up without touching the project file.
# If it ever gets corrupted, `xcodegen generate` here regenerates an equivalent project.
name: NBAStats
options:
  bundleIdPrefix: com.hardwood
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Hardwood:
    type: application
    platform: iOS
    sources:
      # Info.plist must be excluded from the source list. It is processed via INFOPLIST_FILE
      # into Hardwood.app/Info.plist; including it as a resource makes a second command
      # produce that same path, and the build fails with "Multiple commands produce ...".
      # The hand-maintained .xcodeproj expresses the same exclusion as a
      # PBXFileSystemSynchronizedBuildFileExceptionSet.
      - path: NBAStats
        excludes:
          - Info.plist
    # No `info:` block on purpose: that would make XcodeGen *generate* a plist at this path
    # and overwrite the hand-written one, losing the background-task identifiers and the
    # HardwoodAPIBaseURL default.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hardwood.nbastats
        INFOPLIST_FILE: NBAStats/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  HardwoodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NBAStatsTests
    dependencies:
      - target: Hardwood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hardwood.nbastats.tests

schemes:
  Hardwood:
    build:
      targets:
        Hardwood: all
    test:
      targets:
        - HardwoodTests
