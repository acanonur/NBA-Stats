# XcodeGen spec — an alternative to the checked-in NBAStats.xcodeproj.
#
# The .xcodeproj in this directory is hand-maintained and uses Xcode 16 file-system
# synchronized groups, so new Swift files are picked up without touching the project file.
# If it ever gets corrupted, `xcodegen generate` here regenerates an equivalent project.
name: NBAStats
options:
  bundleIdPrefix: com.hardwood
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Hardwood:
    type: application
    platform: iOS
    sources:
      - path: NBAStats
    # Info.plist deliberately lives at ios/Info.plist, OUTSIDE the NBAStats folder. Anything
    # inside that folder is mirrored into the target automatically, so a plist in there gets
    # copied into Hardwood.app/Info.plist as a resource while INFOPLIST_FILE is producing the
    # same path — "Multiple commands produce ..." and the build stops. Keeping it out of the
    # source folder removes the mechanism rather than trying to except one file from it.
    #
    # No `info:` block on purpose either: that would make XcodeGen *generate* a plist and
    # overwrite the hand-written one, losing the background-task identifiers and the
    # HardwoodAPIBaseURL default.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hardwood.nbastats
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  HardwoodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NBAStatsTests
    dependencies:
      - target: Hardwood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hardwood.nbastats.tests

schemes:
  Hardwood:
    build:
      targets:
        Hardwood: all
    test:
      targets:
        - HardwoodTests
